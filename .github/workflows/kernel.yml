name: Kernel-Builder
on: 
  workflow_dispatch:
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v2

    - name: Setting up Env!
      run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install git make bc bison \
          openssl curl zip kmod cpio flex libelf-dev \
          libssl-dev libtfm-dev wget device-tree-compiler \
          ca-certificates python3 python2 binutils \
          binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

    - name: Clone kernel
      run: git clone https://github.com/ProjectMedusaAndroid/android_kernel_samsung_msm8917_Q /home/runner/kernel

    - name: Execute compile script
      run: cd ${HOME}/kernel && sh ${HOME}/kernel/build_medusa.sh
